# ---- Team 67 private DNS · Node 1 (Tathagat) ----
# Start (repo root, port 53 needs root):  sudo dnsmasq -C dns/dnsmasq.conf      Stop: Ctrl+C
# Node 1 IP = Tathagat's Wi-Fi IP. Set on Monday with: scripts/set-ips.sh <T> <J> <G>

keep-in-foreground          # runs in its own terminal tab; the query log prints there
log-facility=-
log-queries                 # every query, with the asking client's IP = proof clients use us

listen-address=10.7.27.239    # Node 1 IP
bind-interfaces
port=53

# Our zone: answered here, never forwarded
local=/team67.test/
host-record=app.team67.test,10.7.27.239   # Node 1 IP (the edge)
host-record=api.team67.test,10.7.27.239   # Node 1 IP (the edge)
local-ttl=60

# Everything else is forwarded upstream, so clients keep normal internet DNS
no-resolv
server=8.8.8.8
server=1.1.1.1
no-hosts                    # answer only our records, not this Mac's /etc/hosts
domain-needed               # never forward bare single-label names
