# ---- Team 67 edge: reverse proxy + TLS + load balancer · Node 1 (Tathagat) ----
# Run from the repo root (ports 80/443 need root):
#   start:  sudo nginx -p "$PWD/" -c nginx/team67.conf
#   reload: sudo nginx -p "$PWD/" -c nginx/team67.conf -s reload
#   stop:   sudo nginx -p "$PWD/" -c nginx/team67.conf -s quit
# IPs (edge, Thejas, Garv) are set on Monday with: scripts/set-ips.sh <T> <J> <G>

worker_processes 1;
pid       run/nginx.pid;
error_log logs/nginx-error.log;

events { worker_connections 256; }

http {
    # Server-side proof of load balancing: which backend served each request
    log_format lb '$time_local $remote_addr:$remote_port "$request" $status '
                  'upstream=$upstream_addr upstream_status=$upstream_status';
    access_log logs/nginx-access.log lb;

    client_body_temp_path run/client_body;
    proxy_temp_path       run/proxy;
    fastcgi_temp_path     run/fastcgi;
    uwsgi_temp_path       run/uwsgi;
    scgi_temp_path        run/scgi;

    # Round-robin (nginx default). Passive health check: 1 failure -> skip that backend for 10s
    upstream team67_backends {
        server 10.7.27.215:3001 max_fails=1 fail_timeout=10s;   # Backend A (Thejas)
        server 10.7.1.77:3002 max_fails=1 fail_timeout=10s;   # Backend B (Garv)
    }

    # Port 80: send everyone to HTTPS
    server {
        listen 10.7.27.239:80;
        server_name app.team67.test api.team67.test;
        return 301 https://$host$request_uri;
    }

    # Port 443: TLS terminates here; the leg to the backends is plain HTTP
    server {
        listen 10.7.27.239:443 ssl;
        http2 on;
        server_name app.team67.test api.team67.test;

        ssl_certificate     ../certs/team67.crt;   # relative to this file's folder
        ssl_certificate_key ../certs/team67.key;
        ssl_protocols       TLSv1.2 TLSv1.3;       # 1.2 kept so the Certificate message is visible in Wireshark

        location / {
            proxy_pass http://team67_backends;
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # Backend down: fail fast, retry the request on the other one
            proxy_connect_timeout 5s;   # Wi-Fi delay spikes up to ~0.5 s; 5 s allows a lost SYN to be retried
            proxy_next_upstream   error timeout http_502 http_503;
        }
    }
}
